<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimLocation - Map Picker (OpenStreetMap)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #map { width: 100%; height: 100%; }
body { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; }

#search-box {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 1000;
}
#search-input {
  width: 320px;
  padding: 10px 14px;
  font-size: 14px;
  border: none;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  outline: none;
  font-family: inherit;
}
#search-input::placeholder { color: #aaa; }

#search-results {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  width: 100%;
  margin-top: 4px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  max-height: 320px;
  overflow-y: auto;
}
.search-item {
  padding: 10px 14px;
  font-size: 13px;
  color: #333;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  line-height: 1.5;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: #f5f7fa; }
.search-item .name { font-weight: 500; }
.search-item .addr { color: #999; font-size: 12px; margin-top: 2px; }
.search-loading, .search-empty {
  padding: 12px 14px;
  font-size: 13px;
  color: #999;
  text-align: center;
}

#panel {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  padding: 16px 24px;
  min-width: 340px;
  text-align: center;
  display: none;
}
#coords {
  font-size: 13px;
  color: #333;
  line-height: 1.8;
  margin-bottom: 12px;
}
#coords .label {
  color: #888;
  font-size: 12px;
}
#confirm-btn {
  display: inline-block;
  padding: 10px 36px;
  font-size: 15px;
  color: #fff;
  background: #1677ff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s;
}
#confirm-btn:hover { background: #0958d9; }
#confirm-btn:active { background: #003eb3; }
#done-msg {
  display: none;
  font-size: 15px;
  color: #52c41a;
  padding: 10px 0 2px;
}
#provider-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  z-index: 1000;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
}
#route-controls { margin-bottom: 12px; }
#route-controls button { border: 0; border-radius: 6px; padding: 7px 10px; background: #f0f2f5; color: #333; cursor: pointer; font: inherit; font-size: 13px; }
#route-hint { font-size: 12px; line-height: 1.6; color: #666; margin-bottom: 10px; }
button:disabled { opacity: 0.45; cursor: default; }
@media (max-width: 480px) {
  #search-box { left: 56px; right: 12px; }
  #search-input { width: 100%; }
  #panel { bottom: 28px; width: calc(100% - 24px); min-width: 0; padding: 16px; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="search-box">
  <input id="search-input" type="text" placeholder="搜索地点..." />
  <div id="search-results"></div>
</div>

<div id="panel">
  <div id="coords"></div>
  <div id="route-controls" hidden>
    <div id="route-hint"></div>
    <button id="route-undo" type="button">撤销上一个点</button>
    <button id="route-reset" type="button">重新绘制</button>
    <button id="route-save" type="button">保存路线</button>
  </div>
  <button id="confirm-btn">确认位置</button>
  <div id="done-msg">已提交</div>
</div>

<div id="provider-badge">OpenStreetMap</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{{ROUTE_SCRIPT}}
/* ---- App state ---- */
var marker = null;
var currentCoords = null;

var panelEl      = document.getElementById("panel");
var coordsEl     = document.getElementById("coords");
var confirmBtn   = document.getElementById("confirm-btn");
var doneMsgEl    = document.getElementById("done-msg");
var searchInput  = document.getElementById("search-input");
var searchResults = document.getElementById("search-results");

/* ---- Map init ---- */
var map = L.map("map").setView([39.909, 116.397], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var routeLayers = L.layerGroup().addTo(map);
initRouteEditor(function (points) {
  routeLayers.clearLayers();
  var line = points.slice();
  if (routeLoop && line.length > 1) line.push(line[0]);
  if (line.length > 1) L.polyline(line, { color: "#1677ff", weight: 4 }).addTo(routeLayers);
  points.forEach(function (point, index) {
    var pin = L.marker(point, { draggable: !routeSubmitted, title: "途经点 " + (index + 1) }).addTo(routeLayers);
    pin.bindTooltip(String(index + 1), { permanent: true, direction: "top" });
    pin.on("dragend", function () {
      var pos = pin.getLatLng();
      moveRoutePoint(index, pos.lat, pos.lng);
    });
  });
}, function (point) { return point; });

/* ---- Click to place marker ---- */
map.on("click", function (e) {
  placeMarker(e.latlng.lat, e.latlng.lng);
  hideResults();
});

function placeMarker(lat, lng) {
  if (routeMode) { addRoutePoint(lat, lng); return; }
  if (marker) {
    marker.setLatLng([lat, lng]);
  } else {
    marker = L.marker([lat, lng], { draggable: true }).addTo(map);
    marker.on("dragend", function () {
      var pos = marker.getLatLng();
      updateCoords(pos.lat, pos.lng);
    });
  }
  updateCoords(lat, lng);
}

function updateCoords(lat, lng) {
  currentCoords = { lat: lat, lon: lng };

  coordsEl.innerHTML =
    '<span class="label">WGS-84:</span> ' +
    lat.toFixed(6) + ", " + lng.toFixed(6);

  panelEl.style.display = "block";
  confirmBtn.style.display = "inline-block";
  doneMsgEl.style.display = "none";
}

/* ---- Search with debounced autocomplete ---- */
var searchTimer = null;

function hideResults() {
  searchResults.style.display = "none";
  searchResults.innerHTML = "";
}

function doSearch(keyword) {
  searchResults.innerHTML = '<div class="search-loading">搜索中...</div>';
  searchResults.style.display = "block";

  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=8&dedupe=0&addressdetails=1&q=" +
        encodeURIComponent(keyword), {
    headers: { "Accept-Language": "zh-CN,zh,en" }
  })
  .then(function (r) { return r.json(); })
  .then(function (results) {
    if (!results || results.length === 0) {
      searchResults.innerHTML = '<div class="search-empty">未找到匹配的地点</div>';
      return;
    }
    searchResults.innerHTML = "";
    results.forEach(function (item) {
      var div = document.createElement("div");
      div.className = "search-item";
      var name = item.display_name.split(",")[0];
      var addr = item.display_name;
      div.innerHTML = '<div class="name">' + escapeHtml(name) + '</div>' +
                      '<div class="addr">' + escapeHtml(addr) + '</div>';
      div.addEventListener("click", function () {
        var lat = parseFloat(item.lat);
        var lng = parseFloat(item.lon);
        map.setView([lat, lng], 16);
        placeMarker(lat, lng);
        searchInput.value = name;
        hideResults();
      });
      searchResults.appendChild(div);
    });
  })
  .catch(function () {
    searchResults.innerHTML = '<div class="search-empty">搜索请求失败，请检查网络</div>';
  });
}

/* Debounced input: triggers 500ms after user stops typing */
searchInput.addEventListener("input", function () {
  clearTimeout(searchTimer);
  var keyword = searchInput.value.trim();
  if (keyword.length < 2) {
    hideResults();
    return;
  }
  searchTimer = setTimeout(function () { doSearch(keyword); }, 500);
});

/* Enter also triggers immediate search */
searchInput.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  clearTimeout(searchTimer);
  var keyword = searchInput.value.trim();
  if (!keyword) return;
  doSearch(keyword);
});

function escapeHtml(str) {
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

/* Close results when clicking outside */
document.addEventListener("click", function (e) {
  if (!document.getElementById("search-box").contains(e.target)) {
    hideResults();
  }
});

/* ---- Confirm ---- */
confirmBtn.addEventListener("click", function () {
  if (routeMode ? confirmBtn.disabled : !currentCoords) return;
  confirmBtn.disabled = true;
  if (routeMode) { routeSubmitted = true; refreshRoute(); }

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "http://127.0.0.1:{{PORT}}/confirm", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        confirmBtn.style.display = "none";
        doneMsgEl.style.display = "block";
        setTimeout(function () { window.close(); }, 600);
      } else {
        confirmBtn.disabled = false;
        if (routeMode) { routeSubmitted = false; refreshRoute(); }
        alert("提交失败，请重试。");
      }
    }
  };
  xhr.onerror = function () {
    confirmBtn.disabled = false;
    if (routeMode) { routeSubmitted = false; refreshRoute(); }
    alert("无法连接到本地服务，请检查终端。");
  };
  xhr.send(JSON.stringify(routeMode ? routePayload() : currentCoords));
});
</script>

</body>
</html>
